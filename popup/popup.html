
<!DOCTYPE html>

<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="lib/codemirror.css">
    <link rel="stylesheet" href="lib/xq-dark.css">
    <link rel="stylesheet" href="lib/xq-light.css">
    <link rel="stylesheet" href="popup.css">
  </head>

<body>
  <div id="container">

    <a href="#" class="button toggle" id="downloadImages"><i class="check"></i>下载图片</a>
    <button type="button" id="openSettings" class="button link-button">⚙️ 设置</button>
    <div class="row" id="clipOption">
      <a href="#" class="button toggle" id="selected"><i class="check"></i>仅选中文字</a>
      <a href="#" class="button toggle" id="document"><i class="check"></i>整个网页</a>
    </div>
    <a href="#" class="button toggle" id="includeTemplate"><i class="check"></i>包含前置/后置模板</a>
    <input type="text" id="title"></input>
    <textarea id="md"></textarea>
    <a href="#" class="button" id="download">💾 下载 Markdown</a>
    <a href="#" class="button" id="downloadSelection">💾 下载选中文字</a>
    <a href="#" class="button" id="aiPolish">✨ AI 优化</a>
  </div>
  <div id="spinner"></div>
  <div id="toast"></div>
  <script type="application/javascript" src="../browser-polyfill.min.js"></script>
  <script type="application/javascript" src="lib/codemirror.js"></script>
  <script type="application/javascript" src="lib/modes/markdown/markdown.js"></script>
  <script type="application/javascript" src="popup.js"></script>
</body>

</html>
